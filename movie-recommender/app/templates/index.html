<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Recommender</title>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --accent:#6c8cff; --text:#e6e8ef; --muted:#9aa0b4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-size: 1.9rem; margin-bottom: 4px; }
    p.sub { color: var(--muted); margin-top: 0; }
    .row { display:flex; gap:10px; margin: 18px 0; flex-wrap: wrap; }
    input { flex:1; min-width: 220px; padding: 12px 14px; border-radius: 10px;
            border:1px solid #2a2e3d; background: var(--card); color: var(--text); font-size: 1rem; }
    button { padding: 12px 18px; border-radius: 10px; border:0; background: var(--accent);
             color:white; font-weight:600; cursor:pointer; font-size: 1rem; }
    button:hover { filter: brightness(1.08); }
    .card { background: var(--card); border:1px solid #242838; border-radius: 12px;
            padding: 14px 16px; margin: 10px 0; }
    .title { font-weight:600; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .bar { height:6px; border-radius:4px; background:#242838; margin-top:8px; overflow:hidden; }
    .bar > span { display:block; height:100%; background: var(--accent); }
    .pill { display:inline-block; background:#242838; color:var(--muted);
            border-radius:999px; padding:2px 9px; font-size:0.75rem; margin-right:6px; cursor:pointer; }
    .pill.on { background: var(--accent); color:white; }
    .hint { color: var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎬 Movie Recommender</h1>
    <p class="sub">Hybrid collaborative + content-based filtering. Pick movies you like, get recommendations.</p>

    <div class="row">
      <input id="search" placeholder="Search a movie you like, e.g. Matrix" />
      <button onclick="search()">Search</button>
    </div>
    <div id="results"></div>

    <h3>Your picks</h3>
    <div id="picks"><span class="hint">No picks yet — search above and click a result to add it.</span></div>
    <div class="row">
      <button onclick="recommend()">Recommend for me</button>
    </div>

    <h3>Recommendations</h3>
    <div id="recs"></div>
  </div>

  <script>
    const liked = new Map();

    async function search() {
      const q = document.getElementById('search').value.trim();
      if (!q) return;
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      const el = document.getElementById('results');
      el.innerHTML = data.results.length ? '' : '<p class="hint">No matches.</p>';
      data.results.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<div class="title">${m.title}</div>
          <div class="meta">${(m.genres || '').replaceAll('|', ' · ')}</div>`;
        div.style.cursor = 'pointer';
        div.onclick = () => addPick(m);
        el.appendChild(div);
      });
    }

    function addPick(m) {
      liked.set(m.movieId, m.title);
      renderPicks();
    }
    function removePick(id) { liked.delete(id); renderPicks(); }

    function renderPicks() {
      const el = document.getElementById('picks');
      if (liked.size === 0) { el.innerHTML = '<span class="hint">No picks yet.</span>'; return; }
      el.innerHTML = '';
      liked.forEach((title, id) => {
        const s = document.createElement('span');
        s.className = 'pill on';
        s.textContent = title + '  ✕';
        s.onclick = () => removePick(id);
        el.appendChild(s);
      });
    }

    async function recommend() {
      if (liked.size === 0) { alert('Add at least one movie you like.'); return; }
      const res = await fetch('/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ liked: [...liked.keys()], k: 10 })
      });
      const data = await res.json();
      const el = document.getElementById('recs');
      el.innerHTML = '';
      (data.recommendations || []).forEach(r => {
        const pct = Math.round((r.score || 0) * 100);
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<div class="title">${r.title}</div>
          <div class="meta">match ${pct}% · collaborative ${Math.round(r.cf_score*100)}% · content ${Math.round(r.cb_score*100)}%</div>
          <div class="bar"><span style="width:${pct}%"></span></div>`;
        el.appendChild(div);
      });
    }

    document.getElementById('search').addEventListener('keydown', e => {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
